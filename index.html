<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-s.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#000000" />
    
    <script src="https://checkout.flutterwave.com/v3.js"></script>
    
    <title>ZingConnect</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ZingConnect">
    
    <link rel="apple-touch-icon" href="/icon.png">
    <link rel="apple-touch-startup-image" href="/logo-s.png">
<script>
  (function() {
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
    const slug = localStorage.getItem('agentSlug') || localStorage.getItem('lastVisitedSlug');
    
    // If we are in PWA mode, and at the wrong URL, we sanitize the history
    if (isStandalone && slug && (window.location.pathname === '/' || window.location.pathname.includes('/pricing'))) {
      // API: history.replaceState(state, unused, newUrl)
      // This changes the URL in the browser without reloading the page
      window.history.replaceState(null, '', '/' + slug);
      
      // Then we perform a soft reload if necessary
      window.location.replace('/' + slug);
    }
  })();
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
