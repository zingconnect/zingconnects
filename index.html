<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-s.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#000000" />
    
    <script src="https://checkout.flutterwave.com/v3.js"></script>
    
    <title>ZingConnect</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ZingConnect">
    
    <link rel="apple-touch-icon" href="/icon.png">
    <link rel="apple-touch-startup-image" href="/logo-s.png">
<script>
    (function() {
      // Only run this logic if the app is launched in standalone mode
      const isStandalone = window.navigator.standalone || 
                           window.matchMedia('(display-mode: standalone)').matches;
      
      if (isStandalone) {
        const savedSlug = localStorage.getItem('agentSlug');
        // If we have a saved slug and we are at the root, force navigation
        if (savedSlug && (window.location.pathname === '/' || window.location.pathname === '/index.html')) {
          window.location.replace('/' + savedSlug);
        }
      }
    })();
  </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
